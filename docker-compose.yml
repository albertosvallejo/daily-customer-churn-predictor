version: '3.9'
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  scoring-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python3", "-m", "src.api.churn_service"]
    env_file:
      - .env
    ports:
      - "62881:62881"
    environment:
      CHURN_API_HOST: 0.0.0.0
      CHURN_API_PORT: 62881
    depends_on:
      - postgres
    volumes:
      - ./:/app

volumes:
  postgres_data:
